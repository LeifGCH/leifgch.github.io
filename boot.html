<!DOCTYPE html><html><body><script>
let w = open("about:blank","_blank");

if(!sessionStorage.r){
  sessionStorage.r = 1;

  w.document.open();
  w.document.write(`
    <!DOCTYPE html>
    <html><body>
      <script>
        fetch("f.txt").then(r=>r.text()).then(t=>{
          document.open();
          document.write(t);
          document.close();
        });
      <\/script>
    </body></html>
  `);
  w.document.close();

  document.body.innerHTML = "";
  document.title = "";
}
</script></body></html>
